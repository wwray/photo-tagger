name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile base image
      - run: pip install -r requirements-dev.txt pip-audit
      - run: pytest -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm install --no-save jsdom@24.1.3
          node tests/js/render_xss.test.cjs
          node tests/js/preview_scroll.test.cjs
      - run: pip-audit -r requirements.txt
